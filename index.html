<style>
  :root{

  a{color:var(--accent);text-decoration:none}

  .logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#58a6ff,#bc8cff)}
  .search{position:relative;flex:1;min-width:180px}
  .search input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:10px 14px 10px 38px;border-radius:9px;font-size:15px;outline:none;transition:.15s}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,.18)}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--txt3)}
  .stat{font-size:13px;color:var(--txt2);white-space:nowrap}
  .stat b{color:var(--accent2)}
  .toolbar{max-width:1180px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .dset{background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:7px 10px;border-radius:9px;font-size:13px;cursor:pointer;max-width:48%}
  .chips{display:flex;gap:7px;flex-wrap:wrap;flex:1;overflow-x:auto;padding-bottom:2px}
  .chip{background:var(--bg3);border:1px solid var(--border);color:var(--txt2);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;transition:.12s;user-select:none;white-space:nowrap}
  .chip:hover{border-color:var(--accent);color:var(--txt)}
  .chip.on{background:rgba(88,166,255,.14);border-color:var(--accent);color:var(--accent)}
  .chip .n{color:var(--txt3);font-size:11px;margin-left:4px}
  .chip.on .n{color:var(--accent)}
  .btn{background:var(--bg3);border:1px solid var(--border);color:var(--txt2);padding:7px 12px;border-radius:9px;font-size:13px;cursor:pointer;transition:.12s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--txt)}
  .sortsel{background:var(--bg3);border:1px solid var(--border);color:var(--txt2);padding:7px 10px;border-radius:9px;font-size:13px;cursor:pointer}
  .cat-title{font-size:18px;font-weight:700;margin:26px 0 4px;display:flex;align-items:center;gap:10px;padding:0 4px}
  .bar{width:8px;height:20px;border-radius:3px;background:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 14px;cursor:pointer;transition:.14s;position:relative;overflow:hidden}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .card.speaking{border-color:var(--accent);box-shadow:0 0 0 2px rgba(88,166,255,.35)}
  .card .w{font-size:20px;font-weight:700;color:var(--txt);display:flex;justify-content:space-between;align-items:center;gap:6px}

  .card .hm{color:#d3dce8;margin-left:7px;font-size:14px;letter-spacing:.5px}
  .card .hm-edit{color:var(--txt3);font-size:14px;margin-left:6px;cursor:pointer;border:1px solid transparent;padding:0 5px;border-radius:6px;user-select:none}
  .card .hm-edit:hover{color:var(--accent);border-color:var(--border);background:var(--bg3)}
  .card .hm-edit.edited{color:var(--accent2)}
  .card .hm-input{background:var(--bg3);border:1px solid var(--accent);color:var(--txt);font-size:14px;padding:2px 6px;border-radius:6px;width:118px;outline:none;margin-left:5px;font-family:inherit}
  .card .hm-btn{background:var(--bg4);border:1px solid var(--border);color:var(--txt2);font-size:14px;padding:2px 8px;margin-left:3px;border-radius:6px;cursor:pointer}
  .card .hm-btn:hover{border-color:var(--accent);color:var(--txt)}
  .card .mn{color:var(--txt2);font-size:15.5px;margin-top:5px}

  .card .mg:before{content:"·";color:var(--accent3);font-weight:700;margin-right:6px}
  .card .scn{color:var(--txt3);font-size:14px;margin-top:7px;line-height:1.6;border-top:1px dashed var(--border);padding-top:7px}
  .card .spk{color:var(--txt3);opacity:0;transition:.14s;display:inline-flex;align-items:center;line-height:0;flex-shrink:0}

  .card.speaking .spk{opacity:1;color:var(--accent)}
  .card .spk .wv{transform-box:fill-box;transform-origin:left center;opacity:.5;transition:.14s}
  .card.speaking .spk .wv{animation:spkWave .9s ease-in-out infinite}
  .card.speaking .spk .wv2{animation-delay:.18s}
  @keyframes spkWave{0%,100%{opacity:.2;transform:scaleX(.55)}50%{opacity:1;transform:scaleX(1.25)}}
  .card .tag{position:absolute;top:0;right:0;font-size:11.5px;color:var(--txt3);background:var(--bg4);padding:1px 7px;border-radius:0 11px 0 8px}
  .empty{text-align:center;color:var(--txt3);padding:60px 0;font-size:15px}
  footer{text-align:center;color:var(--txt3);font-size:12px;padding:30px 16px 0;border-top:1px solid var(--border);margin-top:40px;line-height:1.9}
  .hint{color:var(--txt2)}
  .fold-btn{background:var(--bg3);border:1px solid var(--border);color:var(--txt2);padding:7px 11px;border-radius:9px;font-size:13px;cursor:pointer;white-space:nowrap;transition:.12s;flex-shrink:0;display:flex;align-items:center;gap:5px}

  .fold-btn .arw{font-size:9px;color:var(--txt3);line-height:1}
  header.folded .toolbar{display:none}
  @media(max-width:600px){
    .grid{grid-template-columns:1fr}
    .head-inner{padding:9px 10px;gap:8px;flex-wrap:nowrap}
    .logo{display:none}
    .search{min-width:110px}
    .stat{font-size:12px}
    .fold-btn{padding:6px 9px;font-size:12px}
    .toolbar{gap:7px}
    .dset{order:1;flex:1 1 100%}
    .sortsel{order:2}
    .btn{order:3}
    .chips{order:4;flex-basis:100%}
    .card .spk{opacity:1}
  }
</style>

<script>
const ALL={};
let currentKey='all', activeCat='all', query='', cats=[], colors=['#58a6ff','#3fb950','#f0883e','#bc8cff','#ff7b72','#56d4dd','#f7c948','#a371f7','#79c0ff','#7ee787','#ffa657','#d2a8ff','#f97583','#56d4dd'];
const root=document.getElementById('root'), qInput=document.getElementById('q'), chipsBox=document.getElementById('chips'), totEl=document.getElementById('tot'), sortSel=document.getElementById('sort'), dset=document.getElementById('dset');

function boot(){
  ALL['计算机专用英语']=window.DATA_C||[];
  ALL['英语基础2000']=window.DATA_B||[];
  document.getElementById('dset').querySelector('option[value="all"]').textContent='全部合并（'+(ALL['计算机专用英语'].length+ALL['英语基础2000'].length)+'）';
  loadHomoOverrides();
  const exb=document.getElementById('exportHomo'); if(exb) exb.onclick=exportHomo;
  const imb=document.getElementById('importHomo'); if(imb) imb.onclick=()=>document.getElementById('fileHomo').click();
  document.getElementById('fileHomo').onchange=importHomo;
  const tsel=document.getElementById('ttsMode');
  if(tsel){
    try{ const sm=localStorage.getItem(TTS_KEY); if(sm) ttsMode=sm; }catch(e){}
    tsel.value=ttsMode;
    tsel.onchange=function(){ ttsMode=tsel.value; try{ localStorage.setItem(TTS_KEY,ttsMode); }catch(e){} };
  }
  initFold();
  initUI();
}

/* ===== 顶部工具栏 收起 / 展开（移动端默认收起，选择记在本机） ===== */
const FOLD_KEY='hdrFolded_v1';
function setFolded(v){
  const hdr=document.getElementById('hdr'), fb=document.getElementById('foldBtn');
  if(!hdr||!fb) return;
  hdr.classList.toggle('folded',v);
  fb.innerHTML = v ? '展开<span class="arw">▼</span>' : '收起<span class="arw">▲</span>';
  fb.title = v ? '展开工具栏（分类 / 排序 / 朗读 / 我的修改）' : '收起工具栏，让出更多空间看单词';
  try{ localStorage.setItem(FOLD_KEY, v?'1':'0'); }catch(e){}
}
function initFold(){
  const fb=document.getElementById('foldBtn');
  if(!fb) return;
  let v = (window.innerWidth<=600);
  try{ const s=localStorage.getItem(FOLD_KEY); if(s!==null) v=(s==='1'); }catch(e){}
  setFolded(v);
  fb.onclick=()=>setFolded(!document.getElementById('hdr').classList.contains('folded'));
}

function currentData(){
  if(currentKey==='all') return ALL['计算机专用英语'].concat(ALL['英语基础2000']);
  return ALL[currentKey]||[];
}

function initUI(){
  cats=[...new Set(currentData().map(d=>d.c))];
  dset.onchange=()=>{ currentKey=dset.value; activeCat='all'; buildChips(); render(); };
  buildChips();
  qInput.addEventListener('input',e=>{ query=e.target.value.trim(); render(); });
  sortSel.addEventListener('change',render);
  render();
}

function buildChips(){
  cats=[...new Set(currentData().map(d=>d.c))];
  let html=`<span class="chip on" data-cat="all">全部<span class="n">${currentData().length}</span></span>`;
  cats.forEach((c)=>{
    const n=currentData().filter(d=>d.c===c).length;
    html+=`<span class="chip" data-cat="${c}">${c}<span class="n">${n}</span></span>`;
  });
  chipsBox.innerHTML=html;
  chipsBox.querySelectorAll('.chip').forEach(ch=>{
    ch.onclick=()=>{
      chipsBox.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
      ch.classList.add('on');
      activeCat=ch.dataset.cat;
      render();
    };
  });
}

function hl(text){ if(!query) return text; const re=new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); return text.replace(re,'<b style="color:var(--accent2)">$1</b>'); }

function render(){
  let list=currentData().filter(d=>activeCat==='all'||d.c===activeCat);
  if(query){ const ql=query.toLowerCase(); list=list.filter(d=>d.w.toLowerCase().includes(ql)||d.p.toLowerCase().includes(ql)||d.m.toLowerCase().includes(ql)||d.c.toLowerCase().includes(ql)||(d.s&&d.s.toLowerCase().includes(ql))); }
  const sv=sortSel.value;
  if(sv==='az') list.sort((a,b)=>a.w.localeCompare(b.w));
  else if(sv==='za') list.sort((a,b)=>b.w.localeCompare(a.w));

  totEl.textContent=list.length;
  if(!list.length){ root.innerHTML=`<div class="empty">未找到匹配的词汇 😶</div>`; return; }

  if(sv==='cat'){
    const byCat={};
    list.forEach(d=>{(byCat[d.c]=byCat[d.c]||[]).push(d)});
    let html=''; let gi=0;
    cats.forEach(c=>{
      if(!byCat[c]) return;
      const col=colors[cats.indexOf(c)%colors.length];
      html+=`<div class="cat-title"><span class="bar" style="background:${col}"></span>${c}<span style="color:var(--txt3);font-weight:400;font-size:13px"> · ${byCat[c].length}词</span></div>`;
      html+=`<div class="grid">`;
      byCat[c].forEach((d)=>{ html+=cardHTML(d,col,gi++); });
      html+=`</div>`;
    });
    root.innerHTML=html;
  }else{
    let html=`<div class="cat-title"><span class="bar"></span>搜索结果</div><div class="grid">`;
    list.forEach((d,i)=>html+=cardHTML(d,colors[0],i));
    html+='</div>';
    root.innerHTML=html;
  }
  bindCards();
}

const SPK_SVG='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9.3v5.4h3.3L12 18.6V5.4L7.3 9.3H4z" fill="currentColor"/><path class="wv wv1" d="M14.9 9.2a4.3 4.3 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="wv wv2" d="M17.6 6.7a8.2 8.2 0 0 1 0 10.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
function cardHTML(d,col,i){
  return `<div class="card" data-i="${i}" data-w="${d.w}">
    <span class="tag">${d.c}</span>
    <div class="w">${hl(d.w)}<span class="spk">${SPK_SVG}</span></div>
    <div class="ph">/${hl(d.p)}/<span class="hm">${d.h?' '+hl(d.h):''}</span><span class="hm-edit${userOverrides[d.w]!==undefined?' edited':''}" data-w="${d.w}" title="修改中文谐音">✎</span></div>
    <div class="mn">${meaningsHTML(d)}</div>
    <div class="scn">${d.s?hl(d.s):''}</div>
  </div>`;
}

function meaningsHTML(d){
  const parts=(d.m||'').split('；').filter(Boolean);
  if(parts.length<2) return hl(d.m||'');
  return parts.map(p=>`<span class="mg">${hl(p)}</span>`).join('');
}

/* ===== 中文谐音：编辑 + 本机持久化（localStorage） ===== */
const LS_KEY='homoOverrides_v1';
let userOverrides={}, wordMap={};
function buildWordMap(arr){ wordMap={}; arr.forEach(d=>{ if(d&&d.w) wordMap[d.w]=d; }); }
function applyOverrides(arr){ const m=userOverrides; arr.forEach(d=>{ if(m[d.w]!==undefined) d.h=m[d.w]; }); }
function loadHomoOverrides(){
  const all=ALL['计算机专用英语'].concat(ALL['英语基础2000']);
  all.forEach(d=>{ d.__origH=d.h; }); // 记住原始谐音，供清空修改时还原
  try{ const ls=localStorage.getItem(LS_KEY); if(ls){ const o=JSON.parse(ls); if(o) userOverrides=Object.assign({},o); } }catch(e){}
  applyOverrides(ALL['计算机专用英语']); applyOverrides(ALL['英语基础2000']);
  buildWordMap(all);
}
function persistLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(userOverrides)); }catch(e){} }
function saveHomo(w, val){ const o=wordMap[w]; if(!o) return; if(val===''||val==null){ delete userOverrides[w]; o.h=o.__origH||''; } else { userOverrides[w]=val; o.h=val; } persistLocal(); render(); }
function editHomo(w, card){ const o=wordMap[w]; if(!o) return; const ph=card.querySelector('.ph'); if(!ph||ph.querySelector('.hm-input')) return; const hm=ph.querySelector('.hm'); if(hm) hm.style.display='none'; const input=document.createElement('input'); input.className='hm-input'; input.value=o.h||''; input.placeholder='中文谐音'; const sv=document.createElement('button'); sv.className='hm-btn'; sv.textContent='保存'; const cx=document.createElement('button'); cx.className='hm-btn'; cx.textContent='取消'; ph.appendChild(input); ph.appendChild(sv); ph.appendChild(cx); input.focus(); input.select(); sv.onclick=(e)=>{ e.stopPropagation(); saveHomo(w, input.value.trim()); }; cx.onclick=(e)=>{ e.stopPropagation(); render(); }; input.onclick=(e)=>e.stopPropagation(); input.onkeydown=(e)=>{ if(e.key==='Enter'){e.stopPropagation();sv.click();} else if(e.key==='Escape'){e.stopPropagation();cx.click();} }; }
function exportHomo(){
  const ks=Object.keys(userOverrides);
  if(!ks.length){ alert('你还没有修改过任何谐音。'); return; }
  const txt=JSON.stringify(userOverrides,null,0);
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>alert('已复制 '+ks.length+' 条修改到剪贴板。\n也可点「📥 导入」随时恢复。'),()=>prompt('请复制下面的内容：',txt)); }
  else { prompt('请复制下面的内容：',txt); }
}
function importHomo(e){
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(o&&typeof o==='object'){
        userOverrides=Object.assign({},userOverrides,o);
        persistLocal(); applyOverrides(ALL['计算机专用英语']); applyOverrides(ALL['英语基础2000']);
        alert('已导入 '+Object.keys(o).length+' 条谐音修改。');
        render();
      } else alert('文件格式不正确。');
    }catch(err){ alert('解析失败：'+err.message); }
  };
  r.readAsText(f);
  e.target.value='';
}
function bindCards(){
  root.querySelectorAll('.card').forEach(card=>{
    card.onclick=(e)=>{ if(e.target.closest('.hm-edit,.hm-input,.hm-btn')) return; const w=card.dataset.w; speak(w,3,card); };
    card.querySelectorAll('.hm-edit').forEach(b=>{ b.onclick=(e)=>{ e.stopPropagation(); editHomo(b.dataset.w, card); }; });
  });
}

const synth=window.speechSynthesis||null;
let speakToken=0, gbVoice=null, curAudio=null;
const TTS_KEY='ttsMode_v1';
let ttsMode='auto';
function loadVoices(){
  if(!synth) return;
  try{
    var vs=synth.getVoices()||[];
    gbVoice = vs.filter(function(v){return /en[-_]GB/i.test(v.lang);})[0]
          || vs.filter(function(v){return /^en/i.test(v.lang);})[0] || null;
  }catch(e){}
}
if(synth){ loadVoices(); try{ synth.onvoiceschanged=loadVoices; }catch(e){} }
function clearSpk(){ document.querySelectorAll('.card.speaking').forEach(function(c){ c.classList.remove('speaking'); }); }
function stopAllSpeak(){
  try{ if(synth) synth.cancel(); }catch(e){}
  try{ if(curAudio){ curAudio.pause(); curAudio.currentTime=0; } }catch(e){}
  curAudio=null;
}
function ttsAvailable(){
  if(!synth) return false;
  try{
    var vs=synth.getVoices()||[];
    for(var k=0;k<vs.length;k++){ if(/^en/i.test(vs[k].lang)) return true; }
    return false;
  }catch(e){ return false; }
}
function resolveTTS(){
  if(ttsMode==='online') return 'online';
  if(ttsMode==='system') return synth ? 'system' : 'online';
  return ttsAvailable() ? 'system' : 'online';
}
function audioURL(w){ return 'https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(w)+'&type=1'; }
function speakOne(w, cb){
  if(resolveTTS()==='online'){
    var a=null;
    try{ a=new Audio(audioURL(w)); }catch(e){ setTimeout(cb,300); return; }
    curAudio=a;
    var fin=false;
    function done(){ if(fin) return; fin=true; if(curAudio===a) curAudio=null; cb(); }
    a.onended=done; a.onerror=done;
    var p=null;
    try{ p=a.play(); }catch(e){ done(); return; }
    if(p&&p.catch) p.catch(done);
    setTimeout(done,4500);
    return;
  }
  if(!synth){ setTimeout(cb,300); return; }
  if(!gbVoice) loadVoices();
  var u=new SpeechSynthesisUtterance(w);
  u.lang='en-GB'; u.rate=.85; u.volume=1;
  if(gbVoice) u.voice=gbVoice;
  var f2=false;
  function done2(){ if(f2) return; f2=true; cb(); }
  u.onend=done2; u.onerror=done2;
  try{ synth.speak(u); }catch(e){ done2(); return; }
  setTimeout(done2,4500);
}
function speak(w, times, el){
  var n=times||3, my=++speakToken;
  stopAllSpeak();
  clearSpk();
  var i=0;
  function done(){ if(el) el.classList.remove('speaking'); }
  function play(){
    if(my!==speakToken){ done(); return; }
    speakOne(w, function(){
      if(my!==speakToken){ done(); return; }
      i++;
      if(i<n) setTimeout(play,320); else done();
    });
  }
  if(el) el.classList.add('speaking');
  play();
}

let speakIdx=0, speaking=false;
document.getElementById('speakAll').onclick=function(){
  speakToken++;
  clearSpk();
  if(speaking){ stopAllSpeak(); speaking=false; this.textContent='🔊 朗读'; return; }
  const list=[...root.querySelectorAll('.card')];
  if(!list.length) return;
  speaking=true; this.textContent='⏹ 停止'; speakIdx=0;
  function next(){ if(speakIdx>=list.length){ speaking=false; document.getElementById('speakAll').textContent='🔊 朗读'; clearSpk(); return;} clearSpk(); const cur=list[speakIdx]; cur.classList.add('speaking'); cur.scrollIntoView({block:'center',behavior:'smooth'}); const w=cur.dataset.w; speakOne(w, function(){ speakIdx++; setTimeout(next,250); }); }
  next();
};

boot();
</script>
