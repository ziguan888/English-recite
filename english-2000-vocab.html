<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语基础2000词 · 带音标</title>
<style>
  :root{
    --bg:#0f1419; --bg2:#161b22; --bg3:#1c2128; --bg4:#21262d;
    --border:#30363d; --txt:#e6edf3; --txt2:#8b949e; --txt3:#6e7681;
    --accent:#58a6ff; --accent2:#3fb950; --accent3:#f0883e; --accent4:#bc8cff;
    --red:#ff7b72; --card:#161b22;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;min-height:100vh}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px 80px}
  header{position:sticky;top:0;z-index:50;background:rgba(15,20,25,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .head-inner{max-width:1180px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--txt);padding:9px 14px 9px 38px;border-radius:8px;font-size:14px;outline:none;transition:.15s}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,.18)}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--txt3)}
  .stat{font-size:13px;color:var(--txt2);white-space:nowrap}
  .stat b{color:var(--accent2)}
  .toolbar{max-width:1180px;margin:18px auto 0;padding:0 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chips{display:flex;gap:7px;flex-wrap:wrap;flex:1}
  .chip{background:var(--bg3);border:1px solid var(--border);color:var(--txt2);padding:5px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.12s;user-select:none}
  .chip:hover{border-color:var(--accent);color:var(--txt)}
  .chip.on{background:rgba(88,166,255,.14);border-color:var(--accent);color:var(--accent)}
  .chip .n{color:var(--txt3);font-size:11px;margin-left:4px}
  .chip.on .n{color:var(--accent)}
  .btn{background:var(--bg3);border:1px solid var(--border);color:var(--txt2);padding:5px 11px;border-radius:8px;font-size:12.5px;cursor:pointer;transition:.12s}
  .btn:hover{border-color:var(--accent);color:var(--txt)}
  .sortsel{background:var(--bg3);border:1px solid var(--border);color:var(--txt2);padding:5px 8px;border-radius:8px;font-size:12.5px;cursor:pointer}
  .cat-title{font-size:19px;font-weight:700;margin:30px 0 4px;display:flex;align-items:center;gap:10px}
  .cat-title .bar{width:5px;height:22px;border-radius:3px;background:var(--accent)}
  .cat-sub{color:var(--txt3);font-size:13px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;transition:.14s;position:relative;overflow:hidden}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .card .w{font-size:15.5px;font-weight:700;color:var(--txt);display:flex;justify-content:space-between;align-items:center;gap:6px}
  .card .ph{color:#ffffff;font-size:12.5px;margin-top:2px;font-family:"Cambria Math","Times New Roman",serif}
  .card .hm{color:#d3dce8;margin-left:7px;font-size:12px;letter-spacing:.5px}
  .card .hm-edit{color:var(--txt3);font-size:11px;margin-left:6px;cursor:pointer;border:1px solid transparent;padding:0 4px;border-radius:5px;user-select:none}
  .card .hm-edit:hover{color:var(--accent);border-color:var(--border);background:var(--bg3)}
  .card .hm-edit.edited{color:var(--accent2)}
  .card .hm-input{background:var(--bg3);border:1px solid var(--accent);color:var(--txt);font-size:12px;padding:1px 5px;border-radius:5px;width:92px;outline:none;margin-left:5px;font-family:inherit}
  .card .hm-btn{background:var(--bg4);border:1px solid var(--border);color:var(--txt2);font-size:11px;padding:1px 6px;margin-left:3px;border-radius:5px;cursor:pointer}
  .card .hm-btn:hover{border-color:var(--accent);color:var(--txt)}
  .card .mn{color:var(--txt2);font-size:13px;margin-top:4px}
  .card .mg{display:block;line-height:1.5}
  .card .mg:before{content:"·";color:var(--accent3);font-weight:700;margin-right:6px}
  .card .scn{color:var(--txt3);font-size:11.5px;margin-top:6px;line-height:1.55;border-top:1px dashed var(--border);padding-top:6px}
  .card .spk{color:var(--txt3);font-size:13px;opacity:0;transition:.14s}
  .card:hover .spk{opacity:1}
  .card .tag{position:absolute;top:0;right:0;font-size:9.5px;color:var(--txt3);background:var(--bg4);padding:1px 7px;border-radius:0 10px 0 8px}
  .empty{text-align:center;color:var(--txt3);padding:60px 0;font-size:15px}
  footer{text-align:center;color:var(--txt3);font-size:12px;padding:30px 0 0;border-top:1px solid var(--border);margin-top:40px}
  .legend{font-size:12px;color:var(--txt3);margin-top:6px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}.head-inner{padding:10px 12px}}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="logo"><span class="dot"></span>英语基础2000词 · 2000词</div>
    <div class="search">
      <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="搜索单词 / 音标 / 释义…（支持中英文）" autocomplete="off">
    </div>
    <div class="stat">共 <b id="tot">0</b> 词</div>
  </div>
  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <select class="sortsel" id="sort"><option value="cat">按分类排序</option><option value="az">按字母A-Z</option><option value="za">按字母Z-A</option></select>
    <button class="btn" id="speakAll" title="依次朗读当前结果（可中断）">🔊 朗读</button>
    <button class="btn" id="exportHomo" title="复制我修改过的谐音">📋 我的修改</button>
  </div>
</header>
<div class="wrap" id="root"></div>
<footer>英语基础 2000 词 · 2000 个常用单词带音标 · 英式 IPA 发音 · 仅供学习参考<div style="margin-top:6px;color:var(--txt3)">💡 点词卡上的 ✎ 可修改中文谐音，保存后自动记录，下次打开仍是你改的内容</div></footer>

<script>
/* DATA 由外部 words.js 定义，下方为渲染逻辑 */
function C(){return {};}
</script>
<script src="words-2000.js"></script>
<script>
/* ---- 渲染逻辑 ---- */
const root=document.getElementById('root');
const qInput=document.getElementById('q');
const chipsBox=document.getElementById('chips');
const totEl=document.getElementById('tot');
const sortSel=document.getElementById('sort');

const cats=[...new Set(DATA.map(d=>d.c))];
const colors=['#58a6ff','#3fb950','#f0883e','#bc8cff','#ff7b72','#56d4dd','#f7c948','#a371f7','#79c0ff','#7ee787','#ffa657','#d2a8ff','#f97583','#56d4dd','#e3b341','#ff9bce','#7ee787','#ff7b72','#58a6ff','#bc8cff'];

let activeCat='all', query='';

function buildChips(){
  let html=`<span class="chip on" data-cat="all">全部<span class="n">${DATA.length}</span></span>`;
  cats.forEach((c,i)=>{
    const n=DATA.filter(d=>d.c===c).length;
    html+=`<span class="chip" data-cat="${c}">${c}<span class="n">${n}</span></span>`;
  });
  chipsBox.innerHTML=html;
  chipsBox.querySelectorAll('.chip').forEach(ch=>{
    ch.onclick=()=>{
      chipsBox.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
      ch.classList.add('on');
      activeCat=ch.dataset.cat;
      render();
    };
  });
}

function hl(text){ if(!query) return text; const re=new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); return text.replace(re,'<b style="color:var(--accent2)">$1</b>'); }

function render(){
  let list=DATA.filter(d=>activeCat==='all'||d.c===activeCat);
  if(query){ const ql=query.toLowerCase(); list=list.filter(d=>d.w.toLowerCase().includes(ql)||d.p.toLowerCase().includes(ql)||d.m.toLowerCase().includes(ql)||d.c.toLowerCase().includes(ql)||(d.s&&d.s.toLowerCase().includes(ql))); }
  const sv=sortSel.value;
  if(sv==='az') list.sort((a,b)=>a.w.localeCompare(b.w));
  else if(sv==='za') list.sort((a,b)=>b.w.localeCompare(a.w));

  totEl.textContent=list.length;
  if(!list.length){ root.innerHTML=`<div class="empty">未找到匹配的词汇 😶</div>`; return; }

  if(sv==='cat'){
    const byCat={};
    list.forEach(d=>{(byCat[d.c]=byCat[d.c]||[]).push(d)});
    let html='';
    let gi=0;
    cats.forEach(c=>{
      if(!byCat[c]) return;
      const col=colors[cats.indexOf(c)%colors.length];
      html+=`<div class="cat-title"><span class="bar" style="background:${col}"></span>${c}<span style="color:var(--txt3);font-weight:400;font-size:13px"> · ${byCat[c].length}词</span></div>`;
      html+=`<div class="grid">`;
      byCat[c].forEach((d)=>{
        html+=cardHTML(d,col,gi++);
      });
      html+=`</div>`;
    });
    root.innerHTML=html;
  }else{
    let html=`<div class="cat-title"><span class="bar"></span>搜索结果</div><div class="grid">`;
    list.forEach((d,i)=>html+=cardHTML(d,colors[0],i));
    html+='</div>';
    root.innerHTML=html;
  }
  bindCards();
}

function cardHTML(d,col,i){
  return `<div class="card" data-i="${i}" data-w="${d.w}">
    <span class="tag">${d.c}</span>
    <div class="w">${hl(d.w)}<span class="spk">🔊</span></div>
    <div class="ph">/${hl(d.p)}/<span class="hm">${d.h?' '+hl(d.h):''}</span><span class="hm-edit${userOverrides[d.w]!==undefined?' edited':''}" data-w="${d.w}" title="修改中文谐音">✎</span></div>
    <div class="mn">${meaningsHTML(d)}</div>
    <div class="scn">${d.s?hl(d.s):''}</div>
  </div>`;
}

function meaningsHTML(d){
  const parts=(d.m||'').split('；').filter(Boolean);
  if(parts.length<2) return hl(d.m||'');
  return parts.map(p=>`<span class="mg">${hl(p)}</span>`).join('');
}

/* ===== 中文谐音：编辑 + 持久化（localStorage 即时 + 服务端 JSON 记录） ===== */
const LS_KEY='homoOverrides_v1';
let userOverrides={}, wordMap={};
function buildWordMap(arr){ wordMap={}; arr.forEach(d=>{ if(d&&d.w) wordMap[d.w]=d; }); }
function applyOverrides(arr){ const m=userOverrides; arr.forEach(d=>{ if(m[d.w]!==undefined) d.h=m[d.w]; }); }
async function loadHomoOverrides(){
  try{ const r=await fetch('homo-user-overrides.json',{cache:'no-store'}); if(r.ok){ const s=await r.json(); if(s&&typeof s==='object') userOverrides=Object.assign({},s,userOverrides); } }catch(e){}
  try{ const ls=localStorage.getItem(LS_KEY); if(ls){ const o=JSON.parse(ls); if(o) userOverrides=Object.assign({},userOverrides,o); } }catch(e){}
}
function persistLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(userOverrides)); }catch(e){} }
function persistServer(){ try{ fetch('/api/homo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(userOverrides)}).catch(()=>{}); }catch(e){} }
function saveHomo(w, val){ const o=wordMap[w]; if(!o) return; if(val===''||val==null){ delete userOverrides[w]; o.h=''; } else { userOverrides[w]=val; o.h=val; } persistLocal(); persistServer(); render(); }
function editHomo(w, card){ const o=wordMap[w]; if(!o) return; const ph=card.querySelector('.ph'); if(!ph||ph.querySelector('.hm-input')) return; const hm=ph.querySelector('.hm'); if(hm) hm.style.display='none'; const input=document.createElement('input'); input.className='hm-input'; input.value=o.h||''; input.placeholder='中文谐音'; const sv=document.createElement('button'); sv.className='hm-btn'; sv.textContent='保存'; const cx=document.createElement('button'); cx.className='hm-btn'; cx.textContent='取消'; ph.appendChild(input); ph.appendChild(sv); ph.appendChild(cx); input.focus(); input.select(); sv.onclick=(e)=>{ e.stopPropagation(); saveHomo(w, input.value.trim()); }; cx.onclick=(e)=>{ e.stopPropagation(); render(); }; input.onclick=(e)=>e.stopPropagation(); input.onkeydown=(e)=>{ if(e.key==='Enter'){e.stopPropagation();sv.click();} else if(e.key==='Escape'){e.stopPropagation();cx.click();} }; }
function exportHomo(){ const ks=Object.keys(userOverrides); if(!ks.length){ alert('你还没有修改过任何谐音。'); return; } const txt=JSON.stringify(userOverrides,null,0); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>alert('已复制 '+ks.length+' 条修改到剪贴板：\n'+txt),()=>prompt('请复制下面的内容：',txt)); } else { prompt('请复制下面的内容：',txt); } }
function bindCards(){
  root.querySelectorAll('.card').forEach(card=>{
    card.onclick=(e)=>{ if(e.target.closest('.hm-edit,.hm-input,.hm-btn')) return; const w=card.dataset.w; speak(w); };
    card.querySelectorAll('.hm-edit').forEach(b=>{ b.onclick=(e)=>{ e.stopPropagation(); editHomo(b.dataset.w, card); }; });
  });
}

const synth=window.speechSynthesis||null;
function speak(w){ if(!synth) return; try{ synth.cancel(); const u=new SpeechSynthesisUtterance(w); u.lang='en-GB'; u.rate=.85; synth.speak(u);}catch(e){} }

let speakIdx=0, speaking=false;
document.getElementById('speakAll').onclick=function(){
  if(!synth){ alert('当前浏览器不支持语音朗读'); return; }
  if(speaking){ synth.cancel(); speaking=false; this.textContent='🔊 朗读'; return; }
  const list=[...root.querySelectorAll('.card')];
  if(!list.length) return;
  speaking=true; this.textContent='⏹ 停止'; speakIdx=0;
  function next(){ if(speakIdx>=list.length){ speaking=false; document.getElementById('speakAll').textContent='🔊 朗读'; return;} list[speakIdx].scrollIntoView({block:'center',behavior:'smooth'}); const w=list[speakIdx].dataset.w; const u=new SpeechSynthesisUtterance(w); u.lang='en-GB'; u.rate=.8; u.onend=()=>{speakIdx++;setTimeout(next,250);}; synth.speak(u); }
  next();
};

qInput.addEventListener('input',e=>{ query=e.target.value.trim(); render(); });
sortSel.addEventListener('change',render);
(async()=>{ await loadHomoOverrides(); buildWordMap(DATA); applyOverrides(DATA); const exb=document.getElementById('exportHomo'); if(exb) exb.onclick=exportHomo; buildChips(); render(); })();
</script>
</body>
</html>
